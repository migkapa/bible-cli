[package]
name = "bible-cli"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
description = "Fast, playful Bible CLI: read, search, compare, and memorize scripture in your terminal."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/migkapa/bible-cli"
homepage = "https://github.com/migkapa/bible-cli"
keywords = ["bible", "cli", "scripture", "kjv"]
categories = ["command-line-utilities"]

[[bin]]
name = "bible"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
futures = "0.3"
indicatif = "0.17"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termimad = "0.30"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
